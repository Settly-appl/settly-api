# Settly login theme — styled after the Flutter app (settly-mobile, AppColors).
# Built on `base` rather than `keycloak`/`keycloak.v2` so no PatternFly CSS is
# loaded: every class below is ours and is styled in css/settly.css.
parent=base
locales=pl,en

styles=css/settly.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=settly
kcBodyClass=settly-body
kcLoginClass=settly-page
kcHeaderClass=settly-brand
kcHeaderWrapperClass=settly-brand__inner
kcFormCardClass=settly-card
kcFormHeaderClass=settly-card__header

## Locale switcher
kcLocaleMainClass=settly-locale
kcLocaleWrapperClass=settly-locale__wrapper
kcLocaleDropDownClass=settly-locale__dropdown
kcLocaleListClass=settly-locale__menu
kcLocaleListItemClass=settly-locale__item
kcLocaleItemClass=settly-locale__link

## Alerts
kcAlertClass=settly-alert
kcAlertTitleClass=settly-alert__text

## Forms
kcFormClass=settly-form
kcFormGroupClass=settly-group
kcContentWrapperClass=settly-row
kcLabelWrapperClass=settly-label-wrap
kcLabelClass=settly-label
kcInputWrapperClass=settly-input-wrap
kcInputClass=settly-input
kcTextareaClass=settly-input settly-textarea
kcInputGroup=settly-input-group
kcInputErrorMessageClass=settly-field-error
kcInputHelperTextBeforeClass=settly-help
kcInputHelperTextAfterClass=settly-help
kcFormSettingClass=settly-options-row
kcFormOptionsClass=settly-options
kcFormOptionsWrapperClass=settly-options__wrap
kcFormButtonsClass=settly-buttons
kcFormButtonsWrapperClass=settly-buttons__wrap
kcSignUpClass=settly-signup
kcInfoAreaWrapperClass=settly-signup__inner
kcMarginTopClass=settly-mt

kcCheckboxInputClass=settly-check
kcCheckInputClass=settly-check
kcInputClassCheckbox=settly-check-row
kcInputClassCheckboxInput=settly-check
kcInputClassCheckboxLabel=settly-check-label
kcInputClassRadio=settly-check-row
kcInputClassRadioInput=settly-check
kcInputClassRadioLabel=settly-check-label

kcFormPasswordVisibilityButtonClass=settly-eye
kcFormPasswordVisibilityIconShow=settly-icon settly-icon--eye
kcFormPasswordVisibilityIconHide=settly-icon settly-icon--eye-off

## Buttons
kcButtonClass=settly-btn
kcButtonPrimaryClass=settly-btn--primary
kcButtonDefaultClass=settly-btn--secondary
kcButtonSecondaryClass=settly-btn--secondary
kcButtonBlockClass=settly-btn--block
kcButtonLargeClass=settly-btn--large

## Social providers
kcFormSocialAccountSectionClass=settly-social
kcFormSocialAccountListClass=settly-social__list
kcFormSocialAccountListGridClass=settly-social__list--grid
kcFormSocialAccountListButtonClass=settly-btn settly-btn--secondary settly-btn--block settly-social__btn
kcFormSocialAccountListButtonDisabledClass=settly-btn--disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=settly-social__name

## Authenticator selection / OTP (rare, but keep them legible)
kcSelectAuthListClass=settly-select-list
kcSelectAuthListItemClass=settly-select-item
kcSelectAuthListItemIconClass=settly-select-item__icon
kcSelectAuthListItemBodyClass=settly-select-item__body
kcSelectAuthListItemHeadingClass=settly-select-item__title
kcSelectAuthListItemDescriptionClass=settly-select-item__desc
kcSelectAuthListItemArrowClass=settly-select-item__arrow
kcLoginOTPListClass=settly-otp-list
kcLoginOTPListItemHeaderClass=settly-otp-item
kcLoginOTPListItemTitleClass=settly-otp-item__title
